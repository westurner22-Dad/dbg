window.LIVE=location.hash!=='#demo';
const $=s=>document.querySelector(s); let showCov=true, aa=null, G=null; let SKEY=location.hash==='#demo'?'dbg_demo5':'dbg_live1'; let st=JSON.parse(localStorage.getItem(SKEY)||'null')||{c:null,rounds:[]};  let w=null, sel=null, timerI=null;
const save=()=>{localStorage.setItem(SKEY,JSON.stringify(st));if(window.LIVE&&window.Family)Family.queueSave();};
function log(lines){ st.c.log=(st.c.log||[]).concat(lines).slice(-80); save(); }
function view(h){ $('#app').innerHTML=h; }
function create(){ view(`${st.demo?Demo.createHead():`<div class=tip style="border:2px solid #fc6"><b>▶ Demo Run</b>: one continuous campaign, Qi Gathering → Foundation → Core → Nascent finale with 3 AI cultivators (about 1–3 hours). <button onclick="Demo.enter()">Start / continue Demo Run</button></div>`}<h2>Create cultivator</h2>Name<input id=n value="Wes">Role<select id=r>${Object.keys(DBG.ROLES).map(r=>`<option>${r}</option>`)}</select>
 <p>Base 5/5/5/5. Spend exactly <b>10</b> creation points (max 15 in any stat; no focus bonus). Level 1 then adds +1 focus, +1 Affinity, +3 flex (auto to focus).</p>
 ${DBG.ATTR.map(a=>`<div class=row>${a}&nbsp;<input type=number id=a_${a} value=${a=='Aff'?4:2} min=0 max=10 style="width:80px"></div>`).join('')}
 Player slot<select id=slot><option value=1>Player 1</option><option value=2>Player 2</option><option value=3>Player 3</option><option value=4>Player 4</option></select>Equipped weapon<select id=wp><option>Jade Sword</option><option>Iron Staff</option><option>Twin Fans</option><option>Spirit Focus</option><option>Tower Shield & Mace</option></select>Portrait change request (saved with your character)<textarea maxlength=1000 id=pp placeholder="e.g. tall, silver hair, jade robes"></textarea>Character bio (optional)<textarea maxlength=1500 id=bio placeholder="Who were you before the World Maker pulled you through? (optional)"></textarea>
 <button onclick="doCreate()">Create</button><div id=err></div>`); }
function doCreate(){ try{ const al={}; DBG.ATTR.forEach(a=>al[a]=+$('#a_'+a).value); st.c=DBG.createCharacter($('#n').value,$('#r').value,al); st.c.portraitPrefs=$('#pp').value; st.c.bio=($('#bio')||{}).value||''; st.c.slot=+$('#slot').value; st.c.weapon=$('#wp').value; save(); Portrait.request(st.c); if(window.LIVE) Family.claimCharacter(); else day(); }catch(e){ $('#err').textContent=e.message; } }
function day(){ if(st.demo) return Demo.hub(); const c=st.c; const wk=((c.day-1)%7)>=5;
 view(`<h2>${c.name} — ${c.role} · ${c.realm} ${c.level}</h2>
 <div>Day ${c.day} (${wk?'weekend':'weekday'}) · XP today ${c.xpToday}/${DBG.XP_GOAL} · Inspiration ${c.insp}/3 · Catch-up charges ${c.charges}/3</div>
 <div>Str ${c.attr.Str} Spd ${c.attr.Spd} Tough ${c.attr.Tough} Aff ${c.attr.Aff} · Move ${DBG.movement(c)} · Init ${DBG.initiative(c)}</div>
 ${portraitCard()}<div class=tip>${tipDay()}</div><h3>Recipes</h3>${c.recipes.map((r,i)=>`<label><input type=radio name=rc value=${i} ${i==0?'checked':''} style="width:auto"> ${r.name} ${r.prog}/${r.need}</label><br>`).join('')}
 <div class=row><button onclick="htl()">Hold the Line (Watch)</button><button onclick="qiHome()">Sect Conquest (Qi squad)</button><button onclick="worldOpen()">Explore (Overworld)</button><button onclick="nasStart()">Nascent turns</button><button onclick="wkStart()">⚡ Weekend Boss</button><button onclick="act('meditate')">Meditate</button>
 <button class=s onclick="act('insp')">Spend Inspiration</button><button class=s onclick="act('charge')">Spend catch-up charge</button>
 <button class=s onclick="act('end',true)">End day (played)</button><button class=s onclick="act('end',false)">End day (skipped)</button>
 <button class=s onclick="scoreView()">Score</button></div><details><summary>Test shortcuts / portrait</summary><div class=row>Level <input id=tl type=number min=1 max=10 value=${c.level} style=width:70px><button class=s onclick="setLvl()">Set level</button><button class=s onclick="c_xp()">+50 XP</button><button class=s onclick="skipDays(1)">+1 day</button><button class=s onclick="skipDays(7)">+7 days</button><button class=s onclick="act('cheat')">+1 Insp</button>
</div>Weapon<select id=wp2 onchange="st.c.weapon=this.value;save();Portrait.request(st.c);day()">${['Jade Sword','Iron Staff','Twin Fans','Spirit Focus','Tower Shield & Mace'].map(x=>`<option ${x==c.weapon?'selected':''}>${x}</option>`).join('')}</select>Portrait preferences<textarea oninput="st.c.portraitPrefs=this.value;save();Portrait.request(st.c)">${c.portraitPrefs||''}</textarea></details><div class=row><button class=s onclick="if(confirm('Reset save?')){localStorage.removeItem('dbg_p1');location.reload()}">Reset</button></div>
 <div class=log>${(c.log||[]).slice().reverse().join('\n')}</div>`); }
function act(a,arg){ const c=st.c, i=+(document.querySelector('input[name=rc]:checked')||{value:0}).value; const wk=((c.day-1)%7)>=5;
 if(a==='meditate') log(DBG.meditate(c,i)); if(a==='insp') log(DBG.spendInspiration(c,i)); if(a==='charge') log(DBG.spendCharge(c,i));
 if(a==='end') log(['— end of day '+c.day].concat(DBG.endDay(c,arg,wk))); if(a==='cheat'){c.insp=Math.min(3,c.insp+1);} save(); day(); }
function htl(){ w=DBG.newWatch(st.c); DBG.startWave(w,w.fails>=2); sel=null; draw(); clearInterval(timerI); timerI=setInterval(()=>{const t=$('#tm'); if(t&&w&&!w.waveOver) t.textContent=((Date.now()-w.roundStart)/1000).toFixed(1)+' s';},200); }
function draw(){ const L=w.L, ln=DBG.lanesFor(L), pads=DBG.padsFor(L), tg=DBG.targetsInRange(w), cov=DBG.towerCover(w), reach=w.moved||w.ko?{}:DBG.reachable(w); let g='';
 for(let y=0;y<10;y++) for(let x=0;x<8;x++){ const k=x+','+y, t=w.terr[k]||'', tw=w.towers[k];
  const es=w.active.filter(e=>e.lane===x&&Math.min(9,Math.floor(e.row))===y);
  let cls='c '+(showCov&&cov[k]?'cov ':'')+(!sel&&reach[k]?'reach ':'')+(ln.includes(x)?'lane ':'')+(pads.some(p=>p[0]==x&&p[1]==y)?'pad ':'')+t+(w.ppos[0]==x&&w.ppos[1]==y?' me':'')+(es.some(e=>tg.includes(e))?' rng':'');
  let txt=tw?tw.t.slice(0,4)+tw.tier:''; if(es.length) txt+=' '+es.map(e=>(e.mb?'★':'')+e.k[0]+Math.round(100*e.hp/e.mx)).join(' ');
  if(w.ppos[0]==x&&w.ppos[1]==y) txt='YOU'+(w.ko?' KO':''); if(y==9&&!txt) txt=ln.includes(x)?'GATE':'';
  g+=`<div class="${cls}" onclick="tap(${x},${y})">${txt}</div>`; }
 view(`<div class=row><span class=big>Wave ${w.wave}/3 · Round ${w.round+1}</span>&nbsp;<span class=big id=tm>0.0 s</span></div>
 <div>Gate ${w.gate}/20 · Stones ${Math.floor(w.stones)} · HP ${Math.round(w.php)}/${Math.round(w.pmax)} · Move ${DBG.movement(w.c)} · Range ${DBG.playerRange(w)} · queue ${w.queue.length}</div>
 <div class=tip>${tipHtl()}</div><div id=grid>${g}</div>
 <div class=row>Build: ${Object.keys(DBG.TW).map(t=>`<button class=${sel==t?'':'s'} onclick="sel='${t}';draw()">${t} ${DBG.towerCost(w,t,'build')}</button>`).join('')}<button class=s onclick="sel='up';draw()">Upgrade</button><button class=s onclick="showCov=!showCov;draw()">Ranges ${showCov?'on':'off'}</button><button class=s onclick="sel=null;draw()">Move mode</button></div>
 <div class=row>${w.waveOver?`<b>${w.result==='clear'?'Wave cleared':'Wave failed'}</b>&nbsp;${w.result==='clear'&&w.wave<3?'<button onclick="nextWave()">Next wave</button>':''}${w.result!=='clear'?'<button onclick="retry()">Retry wave</button>':''}<button class=s onclick="leave()">Back to day</button>`:
  `<button onclick="atk()">Attack (${w.acted?'done':'ready'})</button><button onclick="endR()">End round</button><button class=s onclick="leave()">Pause/leave</button>`}</div>
 <div class=log>${(w.msgs||[]).slice(-6).join('\n')}\nTerrain: brown=difficult(2 move) green=high(+1 range) red=hazard(5%/rd) black=obstacle(LOS)\nRound times: ${w.roundLog.slice(-8).map(r=>r.sec+'s').join(', ')}</div>
 <button class=s onclick="exportTimes()">Export round-time log (CSV)</button>`); }
function tap(x,y){ if(w.waveOver) return; let m;
 if(sel==='up') m=DBG.upgrade(w,x+','+y); else if(sel) m=DBG.build(w,[x,y],sel); else m=DBG.movePlayer(w,[x,y]); w.msgs.push(m); draw(); }
function atk(){ w.msgs.push(DBG.playerAttack(w)); draw(); }
function endR(){ const r=DBG.endRound(w); const lr=w.roundLog[w.roundLog.length-1]; st.rounds.push({...lr,role:w.role,level:w.L,t:new Date().toISOString(),ua:navigator.userAgent.slice(0,60)}); save(); if(r) w.msgs.push(r); if(w.waveOver){ DBG.waveReward(st.c,w); log(['Hold the Line wave '+w.wave+': '+w.result+' in '+w.round+' rounds']); } draw(); }
function nextWave(){ DBG.startWave(w,w.fails>=2); draw(); }
function retry(){ w.gate=20; w.wave--; DBG.startWave(w,w.fails>=2); w.msgs.push(w.fails>=2?'Assist mode: -25% wave HP':''); draw(); }
function leave(){ clearInterval(timerI); w=null; save(); day(); }
function exportTimes(){ const csv='t,role,level,wave,round,sec,ua\n'+st.rounds.map(r=>[r.t,r.role,r.level,r.wave,r.round,r.sec,'"'+r.ua+'"'].join(',')).join('\n');
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='htl_round_times.csv'; a.click(); }
function scoreView(){ const c=st.c; const pace=Math.min(100,c.level*10), att=Math.min(100,Object.values(c.attr).reduce((a,b)=>a+b,0)/80*100);
 const tech=100*c.recipes.reduce((a,r)=>a+r.prog/r.need,0)/c.recipes.length; const cats={'Cultivation Pace':pace,'Attributes':att,'Technique Mastery':tech,'Equipment':0,'Weekend Contribution':0,'Economy':0,'Monster':0};
 const s=DBG.score(cats,c.achievements||0);
 view(`<h2>Score (prototype estimate)</h2>${Object.keys(DBG.WEIGHTS).map(k=>`${k} (${DBG.WEIGHTS[k]}%): ${cats[k].toFixed(0)}/100`).join('<br>')}
 <br>Achievements: ${c.achievements||0}/86 pts → +${s.bonus} (separate, max +3)<p class=big>${s.total} / 103</p>
 <small>Pace/Attributes/Technique are solo-vs-target estimates; Equipment, Weekend, Economy, Monster are stubbed at 0 (no other players or loot in Phase 1).</small><br><button onclick="day()">Back</button>`); }

// ---------- tutorial lines ----------
function tipDay(){ const c=st.c; if(c.xpToday<DBG.XP_GOAL) return 'Tip: earn 100 XP (2 Hold the Line waves or 2 Sect Conquest wins), then Meditate for your level and a d20 discovery roll (11+ = progress).';
 if(!c.medToday) return 'Tip: daily goal reached. Meditate now.'; if(c.charges) return 'Tip: spend a catch-up charge for an extra Meditation (needs +50 XP per charge).'; return 'Tip: done for today. End the day (or keep playing for gold).'; }
function tipHtl(){ if(w.waveOver) return w.result==='clear'?'Wave cleared. Next wave, or back to the day.':'Gate fell. Retry (after 2 fails: assist -25% wave HP).';
 if(sel&&sel!=='up') return 'Tap a dashed pad to build '+sel+(sel==='Bastion'?' (on a lane, row 8)':'')+'. Blue outline = tower coverage.';
 if(!w.moved) return 'Tap a green-tinted square to move (brown costs 2). Then Attack (yellow = in range), then End round.';
 if(!w.acted) return 'Attack enemies outlined in yellow, then End round. Towers fire automatically.'; return 'End round when ready. The timer logs how long each round takes.'; }
function setLvl(){ st.c.level=Math.max(1,Math.min(10,+$('#tl').value)); save(); day(); }
function c_xp(){ st.c.xpToday+=50; save(); day(); }
function skipDays(n){ for(let i=0;i<n;i++){ const wk=((st.c.day-1)%7)>=5; log(DBG.endDay(st.c,true,wk)); } save(); day(); }
// ---------- portrait stub (cultivation_02 LOCKED Nov 3): debounce 5 s + cache by prefs+gear+slot; no real generation ----------

 if(fs.dataset.bid!==String(b.bid)){ fs.innerHTML=L.map(([u,i])=>fSprite(u,i)).join('')+'<div class=fsfx></div>'; fs.dataset.bid=b.bid; fs.querySelectorAll('.sp.E').forEach((e,k)=>{ e.classList.add('enter'); setTimeout(()=>e.classList.remove('enter'),700); }); }
 else L.forEach(([u])=>{ const el=$('#u'+u.id); if(!el) return; const sel=fMode&&fMode.tg&&((fMode.tg==='foe')===(u.side==='E'))&&u.hp>0; const was=el.classList.contains('ko');
  el.classList.toggle('ko',u.hp<=0); el.classList.toggle('tgt',!!sel); el.classList.toggle('act',fActive()===u&&b.phase==='cmd'); if(!was&&u.hp<=0){ el.classList.add('fall'); }
  el.querySelector('.nm').textContent=(u.hp<=0?'💀 ':'')+u.name+(u.shield?' 🛡':'')+(u.slow?' 🐌':''); el.querySelector('.hpb i').style.width=Math.max(0,100*u.hp/u.mx)+'%'; });
 const cnt={}; FF.alive(b.E).forEach(u=>cnt[u.name]=(cnt[u.name]||0)+1); $('#fen').innerHTML=Object.keys(cnt).map(k=>`${k}${cnt[k]>1?' '+cnt[k]:''}`).join('<br>')||'—';
 $('#fst').innerHTML=b.P.map(u=>`<div class=strow ${fActive()===u&&b.phase==='cmd'?'style="color:#ff6"':''}><span>${u.em} ${u.name}</span><span>${u.hp}/${u.mx}</span><span>MP ${u.mp}/${u.mmp}</span></div>`).join(''); }
function fCmdUI(){ const b=fb, u=fActive(), box=$('#fcm'); if(b.over||b.phase!=='cmd'){ box.innerHTML=''; return; }
 const back=fCi>0||fMode?`<button class=fc onclick="fBack()">◀ Back</button>`:'';
 if(fMode&&fMode.k==='tech'&&!fMode.t){ box.innerHTML=u.techs.map(t=>{ const c=FF.cost(u,t), ok=u.mp>=c&&!((u.cd[t]||0)>=b.round+1); return `<button class=fc ${ok?'':'disabled'} onclick="fPick('${t}')">${t} <small>${c?c+' MP':'free'}</small></button>`; }).join('')+back; }
 else if(fMode&&fMode.k==='item'&&!fMode.t){ box.innerHTML=Object.keys(FF.ITEMS).map(k=>`<button class=fc ${(b.items[k]||0)-fUsedItems(k)>0?'':'disabled'} onclick="fPick('${k}')">${k} ×${(b.items[k]||0)-fUsedItems(k)}</button>`).join('')+back; }
 else if(fMode&&fMode.tg){ box.innerHTML=`<div class=fhint>${u.name}: tap ${fMode.tg==='foe'?'an enemy':'an ally'}</div>`+back; }
 else box.innerHTML=`<div class=fhint>${u.em} ${u.name}</div><button class=fc onclick="fSet('fight')">Fight</button><button class=fc onclick="fSet('tech')">Techniques</button><button class=fc onclick="fSet('item')">Item</button><button class=fc onclick="fSet('run')">Run</button><button class=fc style="background:#264" onclick="fAuto()">${b.last?'Repeat':'Auto'}</button>`+back;
 $('#fl').textContent=fMsg||(b.round?'':'Enter commands for all four, then the round plays out.'); fRender(); }
function fUsedItems(k){ return Object.values(fCmds).filter(c=>c.k==='item'&&c.t===k).length; }
function fSet(k){ if(k==='run'){ FF.alive(fb.P).forEach(u=>fCmds[u.id]={k:'run'}); return fGo(); } fMode={k,tg:k==='fight'?'foe':null}; fCmdUI(); }
function fPick(t){ const T=FF.TECH[t]; if(fMode.k==='item'){ fMode={k:'item',t,tg:'ally'}; return fCmdUI(); }
 if(T.tg==='self'||T.tg==='all'){ fCmds[fActive().id]={k:'tech',t,tgt:fActive().id}; return fNext(); } fMode={k:'tech',t,tg:T.tg}; fCmdUI(); }
function fTap(id){ if(!fMode||!fMode.tg||fb.phase!=='cmd') return; const u=FF.byId(fb,id); if(!u||u.hp<=0||(fMode.tg==='foe')!==(u.side==='E')) return;
 fCmds[fActive().id]={k:fMode.k,t:fMode.t,tgt:id}; fNext(); }
function fNext(){ fMode=null; fCi++; if(fCi>=FF.alive(fb.P).length) fGo(); else fCmdUI(); }
function fBack(){ if(fMode){ fMode=null; } else if(fCi>0){ fCi--; } fCmdUI(); }
function fAuto(){ const b=fb; fCmds=b.last?Object.assign({},b.last):FF.ai(b); FF.alive(b.P).forEach(u=>{ if(!fCmds[u.id]) fCmds[u.id]=FF.ai(b)[u.id]; }); fGo(); }
function fGo(){ const b=fb; FF.startRound(b,fCmds); fCmds={}; fCi=0; fMode=null; fMsg=''; $('#fcm').innerHTML=`<div class=fhint>Round ${b.round}</div>`; fRender(); clearTimeout(fTimer); fTimer=setTimeout(fStep,350); }
function fAnim(el,c,ms){ if(!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); setTimeout(()=>el.classList.remove(c),ms); }
function fOrb(from,to,col){ const fs=$('#fs'), a=$('#u'+from), t=$('#u'+to); if(!fs||!a||!t) return; const R0=fs.getBoundingClientRect(), ra=a.getBoundingClientRect(), rt=t.getBoundingClientRect(), o=document.createElement('div');
 o.className='orb'; o.style.background=`radial-gradient(circle,#fff,${col} 45%,transparent 70%)`; o.style.left=(ra.left-R0.left+ra.width/2-14)+'px'; o.style.top=(ra.top-R0.top+ra.height/3-14)+'px'; fs.appendChild(o);
 requestAnimationFrame(()=>{ o.style.transform=`translate(${rt.left-ra.left}px,${rt.top-ra.top}px) scale(1.4)`; }); setTimeout(()=>o.remove(),420); }
function fSlash(id){ const t=$('#u'+id); if(!t) return; const s=document.createElement('span'); s.className='slash'; t.appendChild(s); setTimeout(()=>s.remove(),350); }
function fStep(){ const b=fb; if(!b||!$('#fs')) return; const e=FF.act(b);
 if(e){ const el=$('#u'+e.actor.id), c=e.c||{}, T=c.k==='tech'&&FF.TECH[c.t], magic=c.k==='emag'||(T&&!T.phys&&T.tg!=='self'&&T.tg!=='ally'), heal=c.k==='eheal'||c.k==='item'||(T&&T.tg==='ally'), col={Light:'#ffe680',Mass:'#b58cff',Force:'#ff7a5c',Body:'#ffb060'}[e.actor.path]||'#9cf';
   fAnim(el,magic||heal?'cast':'fwd',magic||heal?500:380); $('#fl').textContent=e.line; const big=e.ev.some(x=>+x.txt>=Math.max(60,.3*((FF.byId(b,x.id)||{}).mx||999)));
   setTimeout(()=>{ e.ev.forEach(x=>{ if(magic&&x.id!==e.actor.id) fOrb(e.actor.id,x.id,col); }); },magic?120:0);
   setTimeout(()=>{ fRender(); e.ev.forEach(x=>{ const t=$('#u'+x.id); if(!t) return; const d=document.createElement('span'); d.className='dmg'; d.style.color=x.c||'#fff'; d.textContent=x.txt; t.appendChild(d); setTimeout(()=>d.remove(),900);
     if(/^\d+$/.test(x.txt)){ if(!magic) fSlash(x.id); fAnim(t,'flash',380); } else if(x.c==='#6f6') fAnim(t,'glow',600); });
     if(big) fAnim($('#fs'),'quake',300); },magic?380:160); }
 else fRender();
 if(b.over) return setTimeout(fEnd,900); if(!e||b.phase==='cmd'){ fMsg=''; setTimeout(fCmdUI,e?500:0); return; } fTimer=setTimeout(fStep,760); }
function fEnd(){ const q=qiState(), b=fb, c=st.c, lt=FF.loot(b); let xp=0; q.bag=Object.assign({},b.items);
 if(b.result==='win'){ if(st.demo) lt.gold=Math.round(lt.gold*(1+(st.c.realmIdx||0))); if(!b.world) q.prog[b.t]++; q.gold+=lt.gold; if(st.demo) lt.items.forEach(i=>{ if(i.k==='treasure') i.k='material'; }); q.inv.push(...lt.items); if((!window.LIVE||Live.canXP('sect'))&&(q.wins||0)<2&&c.xpToday<DBG.XP_GOAL){ c.xpToday+=50; xp=50; } q.wins=(q.wins||0)+1; }
 const lootTxt=b.result==='win'?lt.gold+'g'+(lt.items.length?' + '+lt.items.map(i=>i.n).join(' + '):''):'none';
 q.log.push({t:new Date().toISOString(),territory:FF.TERR[b.t].n,level:b.L,enemies:b.E.length,rounds:b.round,used:b.used.join(' ')||'none',sec:Math.round((performance.now()-fT0)/1000),result:b.result,survivors:FF.alive(b.P).length+'/4',loot:lootTxt,ua:navigator.userAgent.slice(0,80)});
 log(['Sect Conquest '+FF.TERR[b.t].n+': '+b.result+' in '+b.round+' rounds'+(xp?' (+50 XP)':'')+(q.prog[b.t]===3&&b.result==='win'?' — territory conquered!':'')]); save();
 if(b.result==='win') document.querySelectorAll('.sp.P:not(.ko)').forEach(s=>s.classList.add('pose'));
 const lines=b.result==='win'?['Obtained '+lt.gold+' gold'].concat(lt.items.map(i=>'Obtained '+i.n)).concat(xp?['+50 XP']:[]).concat(!b.world&&q.prog[b.t]===3?[FF.TERR[b.t].n+' conquered!']:[]):[b.result==='retreat'?'The squad escaped.':'The squad has fallen…'];
 $('#fcm').innerHTML=''; $('#fen').innerHTML=lines.join('<br>'); $('#fl').innerHTML=b.world?`<button class=fc onclick="worldBack()">Continue</button>`:`<button class=fc onclick="qiFight(${b.t})">Next battle</button><button class=fc onclick="qiHome()">Territories</button>`; }
function qiExport(){ const cols=['t','territory','level','enemies','rounds','used','sec','result','survivors','loot','ua']; const rows=qiState().log;
 const csv=cols.join(',')+'\n'+rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,"'")+'"').join(',')).join('\n');
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='qi_battle_log.csv'; a.click(); }
// ================= Explore (Overworld) demo =================
let wMsg='';
function worldOpen(){ st.world=st.world||{}; const maps=st.demo?Demo.maps():['town'], cur=maps.includes(st.world.map||'town')?(st.world.map||'town'):'town'; st.world.map=cur; World.setMap(cur);
 view(`<div class="row whd" style="justify-content:space-between;flex-wrap:nowrap;align-items:center;gap:8px"><span class=big style="flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(15px,4.4vw,22px)" title="${World.MAPS[cur].name}">Explore · ${World.MAPS[cur].name}</span><button class=s style="flex:none;white-space:nowrap;margin:0" onclick="World.stop();save();day()">✕ Leave</button></div>${maps.length>1?`<div class="dtabs wmaps">${maps.map(m=>`<button class="s ${m===cur?'on':''}" onclick="worldMap('${m}')">${World.MAPS[m].name.replace(/^(Whispering |Gray )/,'')}</button>`).join('')}</div>`:''}<div id=wv></div><div class=tip>D-pad to walk (hold), A to talk / pray at ⛩️, B for technique loadout. Tall grass hides Collective scouts. Desktop: arrows + Z/X.</div>`);
 World.open($('#wv'),st.world,{save:s=>{ st.world=s; save(); },battle:worldBattle,shrine:worldShrine,menu:from=>loOpen(from),talk:id=>st.demo?Demo.talk(id):null,poke:(x,y,t)=>st.demo?Demo.poke(x,y,t):null,sprite:()=>st.demo&&window.Spr?Spr.make({path:FF.ROLE2PATH[st.c.role]||'Body',hair:(st.demo.look||{}).hair,gear:Demo.gearLook()}):null,msg:wMsg}); wMsg=''; }
function worldMap(m){ if(st.world.map===m) return; World.stop(); st.world={map:m,beaten:st.world.beaten,pk:st.world.pk}; save(); worldOpen(); }
function worldBattle(kind,npcId){ const q=qiState(), c=st.c, s=st.world, path=FF.ROLE2PATH[c.role]||'Body', pk=s.pk||[1,1], ri=c.realmIdx||0, today=window.LIVE?Live.today():'demo-'+(st.demo?st.demo.d:0);
 const enc=st.demo&&kind!=='trainer'&&window.SYS?SYS.encounter(st,World.mapId,today):{elite:false,rare:null};
 if(enc.elite&&st.demo.phys&&st.demo.phys.am==='night'&&!confirm('Night Vision: this beast is an ELITE (2.5× HP, harder hits, better loot). Fight it?')) return worldOpen();
 view(`<div id=pkv></div>`);
 PK.start($('#pkv'),{ranks:st.demo?Demo.ranks():null,name:c.name||'You',path,L:c.level,trainer:kind==='trainer',hpFrac:pk[0]>0?pk[0]:1,mpFrac:pk[1],bag:q.bag,gear:st.demo?Demo.gx():(q.gear?q.gear.bonus:0),slots:q.slots,beasts:kind==='trainer'?null:World.map.beasts,lvB:World.map.lvB||0,elite:enc.elite,rare:enc.rare},b=>{
  q.bag=Object.assign({},b.bag); s.pk=[b.me.hp/b.me.mx,b.me.mp/b.me.mmp]; const lines=[], d=st.demo;
  if(d&&window.SYS){ SYS.ensure(st); d.ct.casts+=b.casts||0; d.ct.crits+=b.crits||0; d.ct.potions+=b.pots||0; }
  if(b.result==='win'){ const cap=b.foe.elite||b.foe.rare?100:40, xp=window.LIVE&&!Live.canXP('world')?0:Math.max(0,Math.min(cap,Live.xpGoal?Live.xpGoal()-c.xpToday:DBG.XP_GOAL-c.xpToday)), gk=st.demo&&window.SYS?SYS.goldK(st):1, mult=b.foe.rare?5:b.foe.elite?3:1, gold=Math.round(gk*mult*(st.demo?Math.round((b.trainer?20+Math.floor(Math.random()*6):8+Math.floor(Math.random()*5))*(1+ri)):(b.trainer?8+Math.floor(Math.random()*5):2+Math.floor(Math.random()*3))));
   c.xpToday+=xp; q.gold+=gold; lines.push(xp?`${c.name||'You'} gained ${xp} XP!`:'Daily XP goal already met.'); lines.push(`Got ${gold} gold!`);
   let mat=false; if(Math.random()<.3||b.trainer||b.foe.elite||b.foe.rare){ mat=true; const m=b.foe.name.replace(/^Elite /,'')+' '+(b.trainer?'Banner Fang':b.foe.rare?'Heart':['Pelt','Core','Scale','Feather'][Math.floor(Math.random()*4)]); q.inv.push({k:'material',n:m,val:(b.trainer?20:6)*(1+(World.map.lvB||0))*(b.foe.rare?6:b.foe.elite?3:1)}); lines.push(`Found ${m}! (sell it in the Shop)`); }
   if(d&&window.SYS){ d.ct.beastWins++; if(World.mapId==='province') d.ct.province++; if(b.me.hp/b.me.mx<.1) d.ct.lowHp++;
    const rk=d.phys.am==='quick'?.15:.05; s.pk=[Math.min(1,s.pk[0]+rk),Math.min(1,s.pk[1]+rk)]; lines.push(`Victory restores ${Math.round(rk*100)}% HP and Mana.`);
    if(b.foe.elite||b.foe.rare){ const g=GEAR.rand(GEAR.rollQ(null,b.foe.rare?.35:.2),ri); if(b.foe.rare&&['Common','Uncommon'].includes(g.q)){ const g2=GEAR.rand('Rare',ri); Object.assign(g,g2); } q.inv.push(g); lines.push(`${b.foe.rare?'Rare':'Elite'} spoils: ${g.n} (equip it on the Character tab).`); }
    if(b.foe.elite){ d.ct.elites++; if(SYS.rareInsp(st,'elite')) lines.push('✨ Inspiration +1 (elite beast).'); }
    if(b.foe.rare){ d.ct.rares++; d.inspRealm=d.inspRealm||{}; if(!d.inspRealm[ri]){ d.inspRealm[ri]=1; if(SYS.addInsp(st,1,'rare beast')) lines.push('✨ Inspiration +1 (rare beast).'); } }
    SYS.bountyProgress(st,today,{ty:b.foe.ty,mat,tech:(b.casts||0)>0}).forEach(m=>lines.push(m)); SYS.checkAch(st).forEach(m=>lines.push('🏅 '+m)); }
   if(xp&&c.xpToday>=DBG.XP_GOAL) lines.push('Daily XP goal reached! Meditate to grow your Qi.');
   if(b.trainer){ s.beaten=s.beaten||{}; s.beaten[npcId]=1; lines.push('Scout Ren: Hmph. Next time, cultivator.'); } }
  if(b.result==='loss'){ s.pk=[.1,.1]; s.x=11; s.y=7; s.dir='down'; wMsg=`You limp back to the shrine with 10% HP and Mana. Pray at the ⛩️ shrine (${window.SYS?SYS.SHRINE(ri):10}g) or drink a potion. Full strength returns at midnight Pacific.`; }
  q.log.push({t:new Date().toISOString(),territory:'Overworld '+(b.trainer?'trainer':'wild')+': '+b.foe.name,level:c.level,enemies:1,rounds:b.turn,used:'',sec:0,result:b.result,survivors:b.result==='win'?'1/1':'0/1',loot:'',ua:navigator.userAgent.slice(0,80)});
  log([`Overworld: ${b.foe.name} L${b.foe.L} — ${b.result} in ${b.turn} turns`]); save(); return lines; },
  ()=>worldOpen()); }
function worldShrine(w){ const ri=st.c.realmIdx||0, cost=window.SYS?SYS.SHRINE(ri):0, pk=w.pk||[1,1]; if(pk[0]>=1&&pk[1]>=1) return {heal:0,msg:'You pray at the shrine. You are already at full strength.'};
 if(st.qi.gold<cost) return {heal:0,msg:`The shrine keeper bows: healing costs ${cost} gold (you have ${st.qi.gold}g). Potions work too, and you recover fully at midnight Pacific.`};
 st.qi.gold-=cost; if(st.demo&&st.demo.ct) st.demo.ct.spent+=cost; save(); return {heal:1,msg:`You offer ${cost} gold at the shrine. Your cultivator is fully restored!`}; }

function wkStart(x){ const c=st.c||{}; WKUI.open({...(x||{}),path:FF.ROLE2PATH[c.role]||'Body',name:c.name||'You',slots:st.qi&&st.qi.slots,back:()=>{ if(location.hash==='#weekend') history.replaceState(null,'',location.pathname); st.c?day():create(); }}); }
if(!st.demo) st.demo=Demo.init(); if(st.demo) globalThis.DEMO_K=window.LIVE?1:Demo.K;
window.LIVE?Family.boot():location.hash==='#weekend'?(st.c?day():create(),wkStart()):st.c?(location.hash==='#nascent'?nasStart():day()):create();
