<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DBG prototype</title><style>
body{font-family:system-ui,sans-serif;margin:0 auto;background:#111;color:#eee;max-width:520px;padding:8px;padding-bottom:40px;-webkit-text-size-adjust:100%;overflow-x:hidden}
@media(min-width:700px){body{max-width:760px}.c{font-size:13px}}@media(max-width:380px){button{font-size:14px;padding:8px}.c{font-size:9px}}
.tip{background:#233;padding:6px;border-radius:6px;margin:4px 0;font-size:14px}.cov{box-shadow:inset 0 0 0 2px #39f}.reach{background-image:linear-gradient(rgba(45,221,85,.18),rgba(45,221,85,.18))}
.card{display:inline-block;border:1px solid #555;border-radius:8px;padding:8px;margin:3px;min-width:120px;vertical-align:top}.card.sel{border-color:#fd0}.pc{display:flex;gap:8px;align-items:center;background:#1a1a2a;padding:8px;border-radius:8px}.pimg{width:72px;height:72px;border-radius:8px;background:#335;display:flex;align-items:center;justify-content:center;font-size:30px}
html,body{touch-action:manipulation}button,select,#cv,.mv{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.mv{position:fixed;bottom:10px;width:30%;height:84px;font-size:26px;z-index:9;opacity:.92}#mvL{left:8px}#mvR{right:8px}.hpad{height:110px}#cv{width:100%;height:auto;background:#0d1520;border-radius:8px;touch-action:none}.hb{font-size:20px;padding:14px 10px;flex:1}.bar{display:flex;gap:4px;margin:3px 0}.bar button{flex:1;margin:0}
.sq{display:flex;gap:6px}.pan{flex:1;border-radius:8px;padding:4px;display:flex;gap:4px}.pan.P{background:#123a66}.pan.E{background:#5a1717;flex-direction:row-reverse}.col{flex:1;display:flex;flex-direction:column;gap:4px}.tok{border-radius:6px;padding:4px 2px;text-align:center;font-size:12px;color:#000;min-height:52px;position:relative}.tok.dead{opacity:.25}.tok b{font-size:20px;display:block}.hpb{height:6px;background:#300;border-radius:3px;margin-top:2px}.hpb i{display:block;height:6px;background:#4c4;border-radius:3px}.ban{text-align:center;font-size:30px;font-weight:bold;letter-spacing:4px;color:#fd6;margin:6px}.fxt{position:absolute;top:0;right:2px;font-weight:bold}
.t{display:inline-block;width:23%;margin:1%;padding:4px;border-radius:6px;font-size:11px;background:#222;vertical-align:top;box-sizing:border-box}.t.o0{background:#164}.t.o1{background:#634}.t.o2{background:#446}.t.o3{background:#553}.t.at{outline:3px solid #fd0}.t.adj{outline:2px dashed #fd0}
button{font-size:16px;padding:10px 12px;margin:3px;border-radius:8px;border:0;background:#2d5;color:#000}button.s{background:#555;color:#fff}
input,select,textarea{font-size:16px;padding:6px;width:100%;box-sizing:border-box;margin:2px 0}
#grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:6px 0}.c{aspect-ratio:1;background:#222;font-size:11px;display:flex;align-items:center;justify-content:center;border-radius:3px;position:relative;overflow:hidden;text-align:center}
.lane{background:#2a2a3a}.pad{outline:2px dashed #666}.difficult{background:#4a3a20}.high{background:#2f4f2f}.hazard{background:#5a1a1a}.obstacle{background:#000}
.me{outline:3px solid #2d5}.rng{box-shadow:inset 0 0 0 2px #fd0}.log{white-space:pre-wrap;font-size:13px;background:#000;padding:6px;max-height:200px;overflow:auto}
.row{display:flex;flex-wrap:wrap;align-items:center}.big{font-size:22px;font-weight:bold}h2{margin:6px 0}
</style></head><body><div id="app"></div>
<script src="logic.js"></script><script src="nascent.js"></script><script src="htl2.js"></script><script src="squad.js"></script><script>
const $=s=>document.querySelector(s); let showCov=true, aa=null, G=null; let st=JSON.parse(localStorage.getItem('dbg_p1')||'null')||{c:null,rounds:[]}; let w=null, sel=null, timerI=null;
const save=()=>localStorage.setItem('dbg_p1',JSON.stringify(st));
function log(lines){ st.c.log=(st.c.log||[]).concat(lines).slice(-80); save(); }
function view(h){ $('#app').innerHTML=h; }
function create(){ view(`<h2>Create cultivator</h2>Name<input id=n value="Wes">Role<select id=r>${Object.keys(DBG.ROLES).map(r=>`<option>${r}</option>`)}</select>
 <p>Base 5/5/5/5. Spend exactly <b>10</b> creation points (max 15 in any stat; no focus bonus). Level 1 then adds +1 focus, +1 Affinity, +3 flex (auto to focus).</p>
 ${DBG.ATTR.map(a=>`<div class=row>${a}&nbsp;<input type=number id=a_${a} value=${a=='Aff'?4:2} min=0 max=10 style="width:80px"></div>`).join('')}
 Player slot<select id=slot><option value=1>Player 1</option><option value=2>Player 2</option><option value=3>Player 3</option><option value=4>Player 4</option></select>Equipped weapon<select id=wp><option>Jade Sword</option><option>Iron Staff</option><option>Twin Fans</option><option>Spirit Focus</option><option>Tower Shield & Mace</option></select>Portrait preferences<textarea id=pp placeholder="e.g. tall, silver hair, jade robes"></textarea>
 <button onclick="doCreate()">Create</button><div id=err></div>`); }
function doCreate(){ try{ const al={}; DBG.ATTR.forEach(a=>al[a]=+$('#a_'+a).value); st.c=DBG.createCharacter($('#n').value,$('#r').value,al); st.c.portraitPrefs=$('#pp').value; st.c.slot=+$('#slot').value; st.c.weapon=$('#wp').value; save(); Portrait.request(st.c); day(); }catch(e){ $('#err').textContent=e.message; } }
function day(){ const c=st.c; const wk=((c.day-1)%7)>=5;
 view(`<h2>${c.name} — ${c.role} · ${c.realm} ${c.level}</h2>
 <div>Day ${c.day} (${wk?'weekend':'weekday'}) · XP today ${c.xpToday}/${DBG.XP_GOAL} · Inspiration ${c.insp}/3 · Catch-up charges ${c.charges}/3</div>
 <div>Str ${c.attr.Str} Spd ${c.attr.Spd} Tough ${c.attr.Tough} Aff ${c.attr.Aff} · Move ${DBG.movement(c)} · Init ${DBG.initiative(c)}</div>
 ${portraitCard()}<div class=tip>${tipDay()}</div><h3>Recipes</h3>${c.recipes.map((r,i)=>`<label><input type=radio name=rc value=${i} ${i==0?'checked':''} style="width:auto"> ${r.name} ${r.prog}/${r.need}</label><br>`).join('')}
 <div class=row><button onclick="htl()">Hold the Line (Watch)</button><button onclick="qiHome()">Sect Conquest (Qi squad)</button><button onclick="nasStart()">Nascent turns</button><button onclick="act('meditate')">Meditate</button>
 <button class=s onclick="act('insp')">Spend Inspiration</button><button class=s onclick="act('charge')">Spend catch-up charge</button>
 <button class=s onclick="act('end',true)">End day (played)</button><button class=s onclick="act('end',false)">End day (skipped)</button>
 <button class=s onclick="scoreView()">Score</button></div><details><summary>Test shortcuts / portrait</summary><div class=row>Level <input id=tl type=number min=1 max=10 value=${c.level} style=width:70px><button class=s onclick="setLvl()">Set level</button><button class=s onclick="c_xp()">+50 XP</button><button class=s onclick="skipDays(1)">+1 day</button><button class=s onclick="skipDays(7)">+7 days</button><button class=s onclick="act('cheat')">+1 Insp</button>
</div>Weapon<select id=wp2 onchange="st.c.weapon=this.value;save();Portrait.request(st.c);day()">${['Jade Sword','Iron Staff','Twin Fans','Spirit Focus','Tower Shield & Mace'].map(x=>`<option ${x==c.weapon?'selected':''}>${x}</option>`).join('')}</select>Portrait preferences<textarea oninput="st.c.portraitPrefs=this.value;save();Portrait.request(st.c)">${c.portraitPrefs||''}</textarea></details><div class=row><button class=s onclick="if(confirm('Reset save?')){localStorage.removeItem('dbg_p1');location.reload()}">Reset</button></div>
 <div class=log>${(c.log||[]).slice().reverse().join('\n')}</div>`); }
function act(a,arg){ const c=st.c, i=+(document.querySelector('input[name=rc]:checked')||{value:0}).value; const wk=((c.day-1)%7)>=5;
 if(a==='meditate') log(DBG.meditate(c,i)); if(a==='insp') log(DBG.spendInspiration(c,i)); if(a==='charge') log(DBG.spendCharge(c,i));
 if(a==='end') log(['— end of day '+c.day].concat(DBG.endDay(c,arg,wk))); if(a==='cheat'){c.insp=Math.min(3,c.insp+1);} save(); day(); }
function htl(){ w=DBG.newWatch(st.c); DBG.startWave(w,w.fails>=2); sel=null; draw(); clearInterval(timerI); timerI=setInterval(()=>{const t=$('#tm'); if(t&&w&&!w.waveOver) t.textContent=((Date.now()-w.roundStart)/1000).toFixed(1)+' s';},200); }
function draw(){ const L=w.L, ln=DBG.lanesFor(L), pads=DBG.padsFor(L), tg=DBG.targetsInRange(w), cov=DBG.towerCover(w), reach=w.moved||w.ko?{}:DBG.reachable(w); let g='';
 for(let y=0;y<10;y++) for(let x=0;x<8;x++){ const k=x+','+y, t=w.terr[k]||'', tw=w.towers[k];
  const es=w.active.filter(e=>e.lane===x&&Math.min(9,Math.floor(e.row))===y);
  let cls='c '+(showCov&&cov[k]?'cov ':'')+(!sel&&reach[k]?'reach ':'')+(ln.includes(x)?'lane ':'')+(pads.some(p=>p[0]==x&&p[1]==y)?'pad ':'')+t+(w.ppos[0]==x&&w.ppos[1]==y?' me':'')+(es.some(e=>tg.includes(e))?' rng':'');
  let txt=tw?tw.t.slice(0,4)+tw.tier:''; if(es.length) txt+=' '+es.map(e=>(e.mb?'★':'')+e.k[0]+Math.round(100*e.hp/e.mx)).join(' ');
  if(w.ppos[0]==x&&w.ppos[1]==y) txt='YOU'+(w.ko?' KO':''); if(y==9&&!txt) txt=ln.includes(x)?'GATE':'';
  g+=`<div class="${cls}" onclick="tap(${x},${y})">${txt}</div>`; }
 view(`<div class=row><span class=big>Wave ${w.wave}/3 · Round ${w.round+1}</span>&nbsp;<span class=big id=tm>0.0 s</span></div>
 <div>Gate ${w.gate}/20 · Stones ${Math.floor(w.stones)} · HP ${Math.round(w.php)}/${Math.round(w.pmax)} · Move ${DBG.movement(w.c)} · Range ${DBG.playerRange(w)} · queue ${w.queue.length}</div>
 <div class=tip>${tipHtl()}</div><div id=grid>${g}</div>
 <div class=row>Build: ${Object.keys(DBG.TW).map(t=>`<button class=${sel==t?'':'s'} onclick="sel='${t}';draw()">${t} ${DBG.towerCost(w,t,'build')}</button>`).join('')}<button class=s onclick="sel='up';draw()">Upgrade</button><button class=s onclick="showCov=!showCov;draw()">Ranges ${showCov?'on':'off'}</button><button class=s onclick="sel=null;draw()">Move mode</button></div>
 <div class=row>${w.waveOver?`<b>${w.result==='clear'?'Wave cleared':'Wave failed'}</b>&nbsp;${w.result==='clear'&&w.wave<3?'<button onclick="nextWave()">Next wave</button>':''}${w.result!=='clear'?'<button onclick="retry()">Retry wave</button>':''}<button class=s onclick="leave()">Back to day</button>`:
  `<button onclick="atk()">Attack (${w.acted?'done':'ready'})</button><button onclick="endR()">End round</button><button class=s onclick="leave()">Pause/leave</button>`}</div>
 <div class=log>${(w.msgs||[]).slice(-6).join('\n')}\nTerrain: brown=difficult(2 move) green=high(+1 range) red=hazard(5%/rd) black=obstacle(LOS)\nRound times: ${w.roundLog.slice(-8).map(r=>r.sec+'s').join(', ')}</div>
 <button class=s onclick="exportTimes()">Export round-time log (CSV)</button>`); }
function tap(x,y){ if(w.waveOver) return; let m;
 if(sel==='up') m=DBG.upgrade(w,x+','+y); else if(sel) m=DBG.build(w,[x,y],sel); else m=DBG.movePlayer(w,[x,y]); w.msgs.push(m); draw(); }
function atk(){ w.msgs.push(DBG.playerAttack(w)); draw(); }
function endR(){ const r=DBG.endRound(w); const lr=w.roundLog[w.roundLog.length-1]; st.rounds.push({...lr,role:w.role,level:w.L,t:new Date().toISOString(),ua:navigator.userAgent.slice(0,60)}); save(); if(r) w.msgs.push(r); if(w.waveOver){ DBG.waveReward(st.c,w); log(['Hold the Line wave '+w.wave+': '+w.result+' in '+w.round+' rounds']); } draw(); }
function nextWave(){ DBG.startWave(w,w.fails>=2); draw(); }
function retry(){ w.gate=20; w.wave--; DBG.startWave(w,w.fails>=2); w.msgs.push(w.fails>=2?'Assist mode: -25% wave HP':''); draw(); }
function leave(){ clearInterval(timerI); w=null; save(); day(); }
function exportTimes(){ const csv='t,role,level,wave,round,sec,ua\n'+st.rounds.map(r=>[r.t,r.role,r.level,r.wave,r.round,r.sec,'"'+r.ua+'"'].join(',')).join('\n');
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='htl_round_times.csv'; a.click(); }
function scoreView(){ const c=st.c; const pace=Math.min(100,c.level*10), att=Math.min(100,Object.values(c.attr).reduce((a,b)=>a+b,0)/80*100);
 const tech=100*c.recipes.reduce((a,r)=>a+r.prog/r.need,0)/c.recipes.length; const cats={'Cultivation Pace':pace,'Attributes':att,'Technique Mastery':tech,'Equipment':0,'Weekend Contribution':0,'Economy':0,'Monster':0};
 const s=DBG.score(cats,c.achievements||0);
 view(`<h2>Score (prototype estimate)</h2>${Object.keys(DBG.WEIGHTS).map(k=>`${k} (${DBG.WEIGHTS[k]}%): ${cats[k].toFixed(0)}/100`).join('<br>')}
 <br>Achievements: ${c.achievements||0}/86 pts → +${s.bonus} (separate, max +3)<p class=big>${s.total} / 103</p>
 <small>Pace/Attributes/Technique are solo-vs-target estimates; Equipment, Weekend, Economy, Monster are stubbed at 0 (no other players or loot in Phase 1).</small><br><button onclick="day()">Back</button>`); }

// ---------- tutorial lines ----------
function tipDay(){ const c=st.c; if(c.xpToday<DBG.XP_GOAL) return 'Tip: earn 100 XP (2 Hold the Line waves or 2 Sect Conquest wins), then Meditate for your level and a d20 discovery roll (11+ = progress).';
 if(!c.medToday) return 'Tip: daily goal reached. Meditate now.'; if(c.charges) return 'Tip: spend a catch-up charge for an extra Meditation (needs +50 XP per charge).'; return 'Tip: done for today. End the day (or keep playing for gold).'; }
function tipHtl(){ if(w.waveOver) return w.result==='clear'?'Wave cleared. Next wave, or back to the day.':'Gate fell. Retry (after 2 fails: assist -25% wave HP).';
 if(sel&&sel!=='up') return 'Tap a dashed pad to build '+sel+(sel==='Bastion'?' (on a lane, row 8)':'')+'. Blue outline = tower coverage.';
 if(!w.moved) return 'Tap a green-tinted square to move (brown costs 2). Then Attack (yellow = in range), then End round.';
 if(!w.acted) return 'Attack enemies outlined in yellow, then End round. Towers fire automatically.'; return 'End round when ready. The timer logs how long each round takes.'; }
function setLvl(){ st.c.level=Math.max(1,Math.min(10,+$('#tl').value)); save(); day(); }
function c_xp(){ st.c.xpToday+=50; save(); day(); }
function skipDays(n){ for(let i=0;i<n;i++){ const wk=((st.c.day-1)%7)>=5; log(DBG.endDay(st.c,true,wk)); } save(); day(); }
// ---------- portrait stub (cultivation_02 LOCKED Nov 3): debounce 5 s + cache by prefs+gear+slot; no real generation ----------
const Portrait={timer:null,cache:JSON.parse(localStorage.getItem('dbg_pcache')||'{}'),pending:false,
 heldItem:c=>(c.slot||1)===1?(c.weapon||'Jade Sword'):'big blue dildo',
 key:c=>{ const s=(c.portraitPrefs||'')+'|'+Portrait.heldItem(c)+'|'+(c.slot||1); let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))|0; return 'p'+(h>>>0).toString(16); },
 request(c){ clearTimeout(this.timer); this.pending=true; this.timer=setTimeout(()=>this.generate(c),5000); },
 generate(c){ const k=this.key(c); this.pending=false; if(!this.cache[k]){ this.cache[k]={prefs:c.portraitPrefs,held:this.heldItem(c),at:new Date().toISOString()}; /* HOOK: call the image generator here */ localStorage.setItem('dbg_pcache',JSON.stringify(this.cache)); } st.c.portraitKey=k; save(); if($('#pcard')) $('#pcard').outerHTML=portraitCard(); }};
function portraitCard(){ const c=st.c, k=c.portraitKey, e=k&&Portrait.cache[k];
 return `<div class=pc id=pcard><div class=pimg>${(c.slot||1)===1?'⚔️':'🔵'}</div><div><b>${c.name}</b> · Player ${c.slot||1}<br>Holding: <b>${Portrait.heldItem(c)}</b><br><small>${c.portraitPrefs||'(no portrait preferences)'}<br>${Portrait.pending?'regenerating…':e?'cached '+k:'not generated'} · placeholder (no image generation)</small></div></div>`; }
// ---------- Nascent ----------
function nasStart(){ G=st.nas?Object.assign(NAS.newGame(),st.nas,{rng:Math.random}):NAS.newGame(); if(NAS.active(G)!==0) NAS.endTurn(G); nasDraw(); }
let nSel=null;
function nasSave(){ const {rng,...rest}=G; st.nas=rest; save(); }
function nasDraw(){ const me=G.players[0], reach=NAS.reachMarch(G,me);
 const tiles=Object.keys(G.own).map(Number).map(t=>{ const o=G.own[t]; const adj=NAS.ADJ[me.at].includes(t)&&o.o!==0&&!NAS.isHome(t);
  return `<div class="t o${o.o<0?'x':o.o} ${me.at==t?'at':''} ${adj?'adj':''}" onclick="nTap(${t})"><b>${NAS.name(t)}</b><br>${o.o<0?'Collective':G.players[o.o].name} ${o.g?'· '+o.g:''}${G.bld[t]?' · '+G.bld[t]:''}${me.at==t?'<br>ARMY '+me.army:''}</div>`; }).join('');
 view(`<h2>Nascent · Day ${G.day} · Round ${G.round}</h2><div>Your turn · phase ${G.phase} · attacks left ${G.attacks} · army ${me.army}/${me.mob?40:20} · Generals ${me.gens.join(',')} (with army: ${me.armyGen||'none'}) · gold ${me.gold} · level ${me.level} · territories ${NAS.owned(G,0).length}</div>
 <div class=tip>Tap your territory to march (2 steps through own land; Road +1). Tap a dashed enemy tile to attack (max 2). Then fortify (garrison or Watchtower/Road at the army's tile) and End turn. Midnight = levels (1 per 5, max 4; Nexus counts 2), gold 1,300×√T, +5 units. Homelands can't be attacked; nobody is eliminated.</div>
 <div class=row><button onclick="NAS.endTurn(G);nasSave();nasDraw()">End turn</button><button class=s onclick="G.log.push(NAS.fortify(G,'garrison'));nasDraw()">Garrison +2</button><button class=s onclick="G.log.push(NAS.fortify(G,'Watchtower'));nasDraw()">Watchtower</button><button class=s onclick="G.log.push(NAS.fortify(G,'Road'));nasDraw()">Road</button>
 <button class=s onclick="cycleGen()">General: ${me.armyGen||'none'}</button><button class=s onclick="NAS.midnight(G);nasSave();nasDraw()">Midnight (test)</button><button class=s onclick="if(confirm('New Nascent map?')){st.nas=null;nasStart()}">Reset map</button><button class=s onclick="nasSave();day()">Back</button></div>
 <div>${tiles}</div><div class=log>${G.log.slice(-8).reverse().join('\n')}</div>`); }
function cycleGen(){ const p=G.players[0]; if(!p.gens.length) return; const i=p.gens.indexOf(p.armyGen); p.armyGen=p.gens[(i+1)%p.gens.length]; nasDraw(); }
function nTap(t){ const me=G.players[0]; if(G.own[t].o===0){ G.log.push(NAS.march(G,t)); } else G.log.push(NAS.attack(G,t)); nasSave(); nasDraw(); }

// ================= Hold the Line v2 (real-time lane, Age of War style) =================
let hg=null, hLast=0, hRaf=0, hMsg='';
function htl(){ const c=st.c; hg=HTL2.newGame(c.role,c.level,c.realmIdx||0); HTL2.startWave(hg); hMsg='Wave 1: the Collective marches from the right. Buy units with Sect Credit.'; htlView(); hLast=performance.now(); cancelAnimationFrame(hRaf); hRaf=requestAnimationFrame(htlLoop); }
function htlView(){ const U=HTL2.UNITS;
 view(`<div class=row><span class=big>${HTL2.REALMS[hg.R]} ${hg.L} · Wave <span id=hw></span></span></div><div id=hs></div>
 <canvas id=cv width=1000 height=420></canvas><div class=tip id=hm></div>
 <div class=bar><button class=hb id=t1>Burst</button><button class=hb id=t2>Rally</button></div>
 <div class=bar>${Object.keys(U).map(k=>`<button class=hb onclick="hMsg=HTL2.buy(hg,'${k}')">${k}<br><small>${U[k].cost}${U[k].realm?' · Core+':''}</small></button>`).join('')}</div>
 <div class=row id=hctl></div>
 <button class=s onclick="exportWaves()">Export wave log (CSV)</button><div class=hpad></div>
 <button class="hb mv" id=mvL>◀ Back</button><button class="hb mv" id=mvR>Fwd ▶</button>`); 
 const hold=(id,v)=>{ const b=$('#'+id); b.addEventListener('pointerdown',e=>{e.preventDefault();hg.hero.move=v;try{b.setPointerCapture(e.pointerId)}catch(_){}});
   ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();if(hg&&hg.hero.move===v)hg.hero.move=0;})); };
 hold('mvL',-1); hold('mvR',1);
 [['t1',1],['t2',2]].forEach(([id,n])=>$('#'+id).addEventListener('pointerdown',e=>{e.preventDefault();hMsg=HTL2.tech(hg,n);htlHud();}));
 htlHud(); }
function htlHud(){ const g=hg, h=g.hero; $('#hw').textContent=g.wave; $('#hs').textContent=`Gate ${Math.round(g.gate)}/${Math.round(g.gateMax)} · Credit ${Math.floor(g.credit)} · HP ${Math.round(h.hp)}/${Math.round(h.mx)}${h.ko>0?' (KO)':''} · ${Math.round(g.t)} s · kills ${g.kills}`;
 $('#hm').textContent=hMsg; $('#t1').textContent=h.t1>0?'Burst '+Math.ceil(h.t1):'Burst'; $('#t2').textContent=h.t2>0?'Rally '+Math.ceil(h.t2):'Rally';
 $('#hctl').innerHTML=g.waveOver?(`<b>${g.result==='clear'?'Wave cleared':'The Gate fell'}</b>&nbsp;`+(g.result==='clear'?'<button onclick="htlNext()">Next wave</button>':'<button onclick="htl()">Retry Watch</button>')+
   (st.c.level>=10&&(st.c.realmIdx||0)<2?'<button onclick="ageUp()">Age up ⇧</button>':'')+'<button class=s onclick="htlLeave()">Back to day</button>'):'<button class=s onclick="htlLeave()">Leave</button>'; }
function htlLoop(now){ if(!hg||!$('#cv')) return; const dt=Math.min(.1,(now-hLast)/1000); hLast=now; const was=hg.waveOver; HTL2.step(hg,dt);
 if(!was&&hg.waveOver) waveDone(); drawLane(); if(Math.floor(now/250)!==Math.floor((now-dt*1000)/250)||hg.waveOver!==was) htlHud(); hRaf=requestAnimationFrame(htlLoop); }
function drawLane(){ const cv=$('#cv'), x=cv.getContext('2d'), g=hg, W=1000, Y=300; x.clearRect(0,0,W,420);
 x.fillStyle='#1d2b1d'; x.fillRect(0,Y+20,W,100); x.fillStyle='#456'; x.fillRect(0,Y-120,HTL2.GATE_X,140); x.fillStyle='#fff'; x.font='22px sans-serif'; x.fillText('GATE',2,Y-130);
 const bar=(px,py,f,c)=>{ x.fillStyle='#300'; x.fillRect(px-20,py,40,6); x.fillStyle=c; x.fillRect(px-20,py,40*Math.max(0,f),6); };
 bar(HTL2.GATE_X/2+20,Y-160,g.gate/g.gateMax,'#4af');
 for(const a of g.allies){ const u=HTL2.UNITS[a.k], sz=a.k==='General'?30:20; x.fillStyle=u.col; x.fillRect(a.x-sz/2,Y-sz,sz,sz); bar(a.x,Y-sz-10,a.hp/a.mx,'#4c4'); }
 for(const f of g.foes){ const e=HTL2.EN[f.k], sz=e.boss?44:f.k==='Tractor'?34:22; x.fillStyle=e.col; x.beginPath(); x.arc(f.x,Y-sz/2,sz/2,0,7); x.fill(); bar(f.x,Y-sz-10,f.hp/f.mx,'#e44'); }
 const h=g.hero; if(h.ko<=0){ x.fillStyle='#2d5'; x.fillRect(h.x-16,Y-56,32,56); x.fillStyle='#000'; x.font='bold 18px sans-serif'; x.fillText(st.c.role[0],h.x-6,Y-22); bar(h.x,Y-70,h.hp/h.mx,'#2d5'); }
 for(const f of g.fx){ x.strokeStyle=f.c; x.lineWidth=6; x.beginPath(); x.arc(f.x,Y-30,200*(1-f.t/.4)+20,0,7); x.stroke(); }
 x.fillStyle='#fff'; x.font='26px sans-serif'; x.fillText('Credit '+Math.floor(g.credit),W-230,40); x.fillText('Queue '+g.queue.length,W-230,74); }
function waveDone(){ const row=HTL2.waveRow(hg,navigator.userAgent.slice(0,80)); row.t=new Date().toISOString(); (st.waves=st.waves||[]).push(row);
 if(hg.result==='clear'&&hg.wave<=2) st.c.xpToday+=50; log(['Hold the Line wave '+hg.wave+': '+hg.result+' in '+row.sec+' s, '+row.kills+' kills']); hMsg=hg.result==='clear'?(hg.wave<2?'Cleared! Waves 1-2 = daily XP. Next wave is harder.':'Cleared! Keep going for credit and to test your limit.'):'The Collective overwhelmed the Gate.'; save(); }
function htlNext(){ HTL2.startWave(hg); hMsg='Wave '+hg.wave+' incoming.'; htlHud(); }
function ageUp(){ st.c.realmIdx=(st.c.realmIdx||0)+1; st.c.realm=HTL2.REALMS[st.c.realmIdx]; st.c.level=1; log(['Age up! Now '+st.c.realm+' 1: x10 power, enemies too; General unlocked.']); save(); htlLeave(); }
function htlLeave(){ cancelAnimationFrame(hRaf); hg=null; day(); }
function exportWaves(){ const cols=['t','wave','level','realm','sec','kills','earned','spent','units','gate','gateMax','result','ua'];
 const csv=cols.join(',')+'\n'+(st.waves||[]).map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,"'")+'"').join(',')).join('\n');
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='htl_wave_log.csv'; a.click(); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&hg) hLast=performance.now(); });

// ================= Sect Conquest: Qi squad battles (Ogre Battle-style) =================
let qb=null, qRaf=0, qLast=0, qMsg='';
function qiState(){ const c=st.c; st.qi=st.qi||{prog:[0,0,0,0,0],rows:{},gold:0,inv:[],gear:null,extra:{},day:0,wins:0,log:[]}; if(st.qi.day!==c.day){ st.qi.day=c.day; st.qi.wins=0; } return st.qi; }
function qiSquadPaths(){ const me=SQUAD.ROLE2PATH[st.c.role]||'Body'; return [me].concat(['Body','Force','Light','Mass'].filter(p=>p!==me)); }
function qiRow(p){ const q=qiState(); return q.rows[p]||SQUAD.PATHS[p].row; }
function qiToggle(p){ const q=qiState(), r=qiRow(p)==='F'?'B':'F'; const fronts=qiSquadPaths().filter(x=>(x===p?r:qiRow(x))==='F').length; if(fronts<1){ qMsg='Keep at least one in front.'; } else q.rows[p]=r; save(); qiHome(); }
function qiHome(){ const q=qiState(), c=st.c, ps=qiSquadPaths();
 view(`<div class=big>Sect Conquest · Qi ${c.level}</div><div class=tip>${qMsg||'Pick a territory. 3 wins conquers it. First 2 wins today give +50 XP each; after that, battles still drop gold, gear and treasures.'} Wins today: ${q.wins}</div>
 <h3>Squad (tap to swap row)</h3><div class=bar>${ps.map((p,i)=>`<button class=hb style="background:${SQUAD.PATHS[p].col};color:#000" onclick="qiToggle('${p}')">${i?p:'You ('+p+')'}<br><small>${qiRow(p)==='F'?'Front':'Back'}</small></button>`).join('')}</div>
 <h3>Territories</h3>${SQUAD.TERR.map((t,i)=>`<button style="width:100%;text-align:left" onclick="qiFight(${i})">${q.prog[i]>=3?'✅ ':''}${t.n} · enemy Qi ~${t.lv} · ${Math.min(3,q.prog[i])}/3${q.prog[i]>=3?' (conquered: replay for loot)':''}</button>`).join('')}
 <h3>Inventory · ${q.gold} gold${q.gear?' · equipped '+q.gear.n:''}</h3>${q.inv.length?q.inv.map((it,i)=>`<div class=row>${it.n} (${it.val}g) <button class=s onclick="qiSell(${i})">Sell</button>${it.k==='gear'?`<button class=s onclick="qiEquip(${i})">Equip</button>`:''}</div>`).join(''):'<div>Empty</div>'}
 <div class=row>${Object.keys(SQUAD.CARDS).map(k=>`<button class=s onclick="qiBuy('${k}')">+1 ${k} (30g) [${q.extra[k]||0}]</button>`).join('')}</div>
 <div class=row><button class=s onclick="qiExport()">Export battle log (CSV)</button><button class=s onclick="qMsg='';day()">Back to day</button></div>`); }
function qiSell(i){ const q=qiState(), it=q.inv.splice(i,1)[0]; q.gold+=it.val; qMsg='Sold '+it.n+' for '+it.val+' gold.'; save(); qiHome(); }
function qiEquip(i){ const q=qiState(), it=q.inv.splice(i,1)[0]; if(q.gear) q.inv.push(q.gear); q.gear=it; qMsg='Equipped '+it.n+' (+'+Math.round(it.bonus*100)+'% your HP/attack).'; save(); qiHome(); }
function qiBuy(k){ const q=qiState(); if(q.gold<30){ qMsg='Need 30 gold.'; } else { q.gold-=30; q.extra[k]=(q.extra[k]||0)+1; qMsg='Bought a '+k+' charge.'; } save(); qiHome(); }
function qiFight(t){ const q=qiState(), ps=qiSquadPaths(); qb=SQUAD.newBattle({role:st.c.role,L:st.c.level,terr:t,battle:Math.min(2,q.prog[t]%3),rows:ps.map(qiRow),gear:q.gear?q.gear.bonus:0});
 qb.extraUsed={}; qMsg=''; qiView(); qLast=performance.now(); cancelAnimationFrame(qRaf); qRaf=requestAnimationFrame(qiLoop); }
function qiCards(){ const q=qiState(); return Object.keys(SQUAD.CARDS).map(k=>`<button class=hb onclick="qiCard('${k}')">${k}<br><small>${qb.cards[k]+(q.extra[k]||0)} left</small></button>`).join(''); }
function qiView(){ const b=qb; view(`<div class=big>${SQUAD.TERR[b.t].n} · battle ${b.bi+1}/3</div><div id=qh></div><div class=sq><div class="pan P" id=qp></div><div class="pan E" id=qe></div></div>
 <div id=qban class=ban></div><div class=tip id=qm></div>
 <div class=bar><button class=hb id=qpause onclick="qb.paused=!qb.paused;qiHud()">Pause</button><button class=hb id=qtac onclick="qiTac()">Tactic</button><button class=hb onclick="SQUAD.retreat(qb)">Retreat</button></div>
 <div class=bar id=qcards>${qiCards()}</div><div class=row id=qend></div>`); qiHud(); }
function qiTac(){ const T=SQUAD.TACTICS; qb.tactic=T[(T.indexOf(qb.tactic)+1)%T.length]; qiHud(); }
function qiCard(k){ const q=qiState(), b=qb; if(!b.cards[k]&&(q.extra[k]||0)>0&&!b.over){ q.extra[k]--; b.cards[k]++; save(); } qMsg=SQUAD.card(b,k); $('#qcards').innerHTML=qiCards(); qiHud(); }
function qiPanel(units){ const col=r=>`<div class=col>${units.filter(u=>u.row===r).map(u=>{ const f=qb.fx.filter(x=>x.u===u).pop();
  return `<div class="tok ${u.hp<=0?'dead':''}" style="background:${SQUAD.PATHS[u.path].col}"><b>${SQUAD.PATHS[u.path].ic}${u.leader?'★':''}</b>${u.name.split(' ').pop()}${u.stun?' 💫':''}<div class=hpb><i style="width:${100*u.hp/u.mx}%"></i></div>${f?`<span class=fxt style="color:${f.c}">${f.txt}</span>`:''}</div>`; }).join('')}</div>`;
 return col('B')+col('F'); }
function qiHud(){ const b=qb; $('#qh').textContent=`Round ${b.round}/3 · ${Math.round(b.time)} s · Tactic: ${b.tactic}${b.paused?' · PAUSED':''}`; $('#qp').innerHTML=qiPanel(b.P); $('#qe').innerHTML=qiPanel(b.E);
 $('#qm').textContent=qMsg||b.log[b.log.length-1]||''; $('#qtac').textContent='Tactic: '+b.tactic; $('#qpause').textContent=b.paused?'Resume':'Pause';
 if(b.over){ $('#qban').textContent=b.result==='win'?'WINNERS':b.result==='retreat'?'RETREAT':'DEFEAT'; } }
function qiLoop(now){ if(!qb||!$('#qp')) return; const dt=Math.min(.1,(now-qLast)/1000); qLast=now; const was=qb.over; SQUAD.step(qb,dt); qiHud(); if(!was&&qb.over) qiDone(); if(!qb.over) qRaf=requestAnimationFrame(qiLoop); }
function qiDone(){ const q=qiState(), b=qb, c=st.c, lt=SQUAD.loot(b); let xp=0;
 if(b.result==='win'){ q.prog[b.t]++; q.gold+=lt.gold; q.inv.push(...lt.items); if(q.wins<2&&c.xpToday<DBG.XP_GOAL){ c.xpToday+=50; xp=50; } q.wins++; }
 const lootTxt=b.result==='win'?lt.gold+'g'+(lt.items.length?' + '+lt.items.map(i=>i.n).join(' + '):''):'none';
 q.log.push({t:new Date().toISOString(),territory:SQUAD.TERR[b.t].n,level:b.L,enemies:b.E.length,tactic:b.tactic,cards:b.used.join(' ')||'none',sec:Math.round(b.time),result:b.result,survivors:SQUAD.alive(b.P).length+'/4',loot:lootTxt,ua:navigator.userAgent.slice(0,80)});
 log(['Sect Conquest '+SQUAD.TERR[b.t].n+': '+b.result+(xp?' (+50 XP)':'')+(q.prog[b.t]===3&&b.result==='win'?' — territory conquered!':'')]); save();
 $('#qend').innerHTML=`<b>${b.result==='win'?'Loot: '+lootTxt+(xp?' · +50 XP':''):b.result==='retreat'?'Retreated, no loot':'Defeated, no loot'}</b><button onclick="qiFight(${b.t})">Fight again</button><button class=s onclick="qiHome()">Territories</button>`; }
function qiExport(){ const cols=['t','territory','level','enemies','tactic','cards','sec','result','survivors','loot','ua']; const rows=qiState().log;
 const csv=cols.join(',')+'\n'+rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,"'")+'"').join(',')).join('\n');
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='qi_battle_log.csv'; a.click(); }

st.c?day():create();
</script></body></html>
